    else{hc++;score+=mode==='boss'?10:1;burst(i.x,i.y,pCol(heartCol(i)),10);if(boss)boss.hp-=3.5;if(cur==='lena'&&hc%20===0&&lives<6){lives++;burst(p.x,p.y,'#ff3d71',24)}}
    ui()}
   else if(i.y>H+30||i.y<-60||i.x<-40||i.x>W+40)i.dead=1});
  items=items.filter(i=>!i.dead);
  if(eff>0)eff-=dt;if(cdT>0)cdT-=dt;
  if(boss&&boss.hp<=0&&run){score+=500+lives*50;end('win')}
  else if(lives<=0&&run)end('end');
 }
 if(overT>0){overT-=dt;if(overT<=0)showOver()}
 // draw
 items.forEach(i=>{if(i.orb){x.fillStyle=light?'#c2185b':'#ff80ab';x.beginPath();x.arc(i.x,i.y,9,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(i.x,i.y,3.5,0,7);x.fill()}
  else if(i.bad){x.fillStyle='#000';x.strokeStyle=light?'#c2185b':o.c;x.lineWidth=2;spike(i.x,i.y,20,i.a)}
  else drawHeart(i.x,i.y,40*(1+.06*Math.sin(tN*6+i.x)),heartCol(i))});
 if(boss){const b=boss,pc=light?'#c2185b':'#ff80ab';x.fillStyle='#000';x.strokeStyle=pc;x.lineWidth=3;spike(b.x,b.y,40,tN*.8);
  x.fillStyle='#fff';[-13,13].forEach(dx=>{x.beginPath();x.arc(b.x+dx,b.y-3,7,0,7);x.fill()});x.fillStyle='#000';[-13,13].forEach(dx=>{const a=Math.atan2(p.y-b.y,p.x-b.x);x.beginPath();x.arc(b.x+dx+Math.cos(a)*3,b.y-3+Math.sin(a)*3,3,0,7);x.fill()});
  x.fillStyle='rgba(128,128,128,.35)';x.fillRect(20,14,W-40,10);x.fillStyle=pc;x.fillRect(20,14,(W-40)*Math.max(b.hp,0)/100,10)}
 x.fillStyle=o.c;if(!low&&dev!=='phone'){x.shadowColor=o.c;x.shadowBlur=10}bul.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));x.shadowBlur=0;
 parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l-=dt;x.globalAlpha=Math.max(q.l*2,0);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()});x.globalAlpha=1;parts=parts.filter(q=>q.l>0);
 x.drawImage(glowSpr(o.c),p.x-36,p.y-36);
 if(cur==='polina'&&eff>0){x.strokeStyle='#fff';x.lineWidth=3;x.globalAlpha=.6+.4*Math.sin(tN*12);x.beginPath();x.arc(p.x,p.y,46,0,7);x.stroke();x.globalAlpha=1}
 if(cur==='igor'&&eff>0){x.strokeStyle=o.c;x.lineWidth=2;for(let j=0;j<3;j++){x.globalAlpha=.5-j*.15;x.beginPath();x.arc(p.x,p.y,44+j*10+Math.sin(tN*6)*3,0,7);x.stroke()}x.globalAlpha=1}
 if(cur==='alina'&&eff>0){x.font='24px sans-serif';x.textAlign='center';x.fillText('🔫',p.x+30,p.y-8)}
 if(flash>0){flash-=dt;x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H)}

 if(mode==='sprint'&&(run||overT>0))x.fillText('⏱ '+Math.ceil(timeLeft)+tx('s'),W-16,34);
 if(o.cd){const w=(cdT>0?Math.round(cdT/cdM*100):0)+'%';if(w!==aW){aW=w;$('abf').style.width=w}const a=o[LG].ab,t=eff>0?a+' · '+eff.toFixed(1)+tx('s'):cdT>0?a+' · '+Math.ceil(cdT)+tx('s'):a+' — '+tx('ready');if(t!==aT){aT=t;$('abt').textContent=t}}else if(aW!=='0%'){aW='0%';$('abf').style.width='0'}
 if(!run&&overT<=0&&endKind){x.textAlign='center';x.font='bold 28px sans-serif';x.fillText((endKind==='win'?tx('win'):endKind==='tm'?tx('tm'):tx('end'))+(endKind==='end'?score:''),W/2,H/2)}

// ===== SECRET: names fly, site breaks, sandbox =====
let sec=null,drag=null;
const SEL='.li,.sh b,h1 span,.chip,.ver,.soon,.sub,.ib,.btn,.stat,.ch,.ar,canvas,.hint,.sgb,.mdesc';
function put(i){i.el.style.transform=`translate(${i.x}px,${i.y}px) rotate(${i.rot}rad)`}
function pin(i){const s=i.el.style;s.position='fixed';s.left='0';s.top='0';s.width=i.w+'px';s.height=i.h+'px';s.margin='0';s.zIndex=i.el.classList.contains('fl')?12:9;s.transition='none';s.animation='none';s.opacity='1';s.cursor='grab';s.touchAction='none';put(i)}
function secret(){if(sec||document.querySelector('.ov.show'))return;
 sec={its:[],t:0,t0:performance.now(),fall:false,last:performance.now()};document.body.classList.add('sec','shake');
 const names=Object.values(CH).map(o=>o[LG].n);
 for(let r=0;r<3;r++)names.forEach(n=>{const el=document.createElement('div');el.className='fl';el.textContent=n;document.body.appendChild(el);
  const w=el.offsetWidth,h=el.offsetHeight,a=Math.random()*6.28,s=350+Math.random()*350;
  const i={el,w,h,x:Math.random()*(innerWidth-w),y:Math.random()*(innerHeight-h),vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:0,vr:(Math.random()-.5)*8,chip:1};sec.its.push(i);pin(i)});
 requestAnimationFrame(secLoop)}
function breakAll(){sec.fall=true;document.body.classList.remove('shake');scrollTo(0,0);document.body.classList.add('broken');
 const all=[...document.querySelectorAll(SEL)].filter(e=>!e.closest('.ov')&&e.id!=='fix'&&e.getClientRects().length);
 const els=[],rs=[];const sideShut=document.body.classList.contains('phone')&&!$('side').classList.contains('open');
 all.forEach(e=>{if(sideShut&&e.closest('.side'))return;els.push(e);rs.push(e.getBoundingClientRect())});
 els.forEach((e,n)=>{const r=rs[n];const i={el:e,w:r.width,h:r.height,x:r.left,y:r.top,vx:(Math.random()-.5)*400,vy:-Math.random()*300,rot:0,vr:(Math.random()-.5)*3,old:e.getAttribute('style')};sec.its.push(i);pin(i)})}
function secLoop(now){if(!sec)return;const dt=Math.min((now-sec.last)/1000,.05);sec.last=now;sec.t+=dt;
 if(!sec.fall&&now-sec.t0>3200)breakAll();
 const Wd=innerWidth,Hd=innerHeight;
 sec.its.forEach(i=>{if(i.drag)return;
  if(sec.fall)i.vy+=1900*dt;
  i.x+=i.vx*dt;i.y+=i.vy*dt;i.rot+=i.vr*dt;
  if(i.x<0){i.x=0;i.vx=Math.abs(i.vx)*.6}if(i.x+i.w>Wd){i.x=Wd-i.w;i.vx=-Math.abs(i.vx)*.6}
  if(i.y<0&&!sec.fall){i.y=0;i.vy=Math.abs(i.vy)}
  if(i.y+i.h>Hd){i.y=Hd-i.h;i.vy=sec.fall?-Math.abs(i.vy)*.4:-Math.abs(i.vy);if(sec.fall){i.vx*=.92;i.vr*=.85;if(Math.abs(i.vy)<40)i.vy=0}}
  put(i)});
 requestAnimationFrame(secLoop)}
function restore(){if(!sec)return;sec.its.forEach(i=>{if(i.chip)i.el.remove();else if(i.old===null)i.el.removeAttribute('style');else i.el.setAttribute('style',i.old)});
 sec=null;drag=null;document.body.classList.remove('sec','shake','broken');scrollTo(0,0);
 renderCards();setName(CH[cur][LG].n);renderSegs();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{centerCur('instant');cover();hl()}))}
$('fix').onclick=restore;
document.addEventListener('click',e=>{if(sec&&!e.target.closest('#fix')){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('pointerdown',e=>{if(!sec||!sec.fall||e.target.closest('#fix'))return;
 const it=[...sec.its].reverse().find(i=>i.el===e.target||i.el.contains(e.target));if(!it)return;e.preventDefault();
 it.drag=true;it.vx=it.vy=0;drag={it,ox:e.clientX-it.x,oy:e.clientY-it.y,lx:e.clientX,ly:e.clientY,vx:0,vy:0,lt:performance.now()};it.el.style.cursor='grabbing';it.el.style.zIndex=15},true);
addEventListener('pointermove',e=>{if(!drag)return;const n=performance.now(),d=Math.max((n-drag.lt)/1000,.001);
 drag.vx=drag.vx*.6+((e.clientX-drag.lx)/d)*.4;drag.vy=drag.vy*.6+((e.clientY-drag.ly)/d)*.4;drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=n;
 drag.it.x=e.clientX-drag.ox;drag.it.y=e.clientY-drag.oy;put(drag.it)});
addEventListener('pointerup',()=>{if(!drag)return;const i=drag.it;i.drag=false;i.vx=Math.max(-2500,Math.min(2500,drag.vx));i.vy=Math.max(-2500,Math.min(2500,drag.vy));i.vr=i.vx/Math.max(i.w,60)*2;i.el.style.cursor='grab';drag=null});
// ===== init =====
document.body.classList.toggle('low',low);
$('dev').classList.remove('show');
setDev(dev,false);applyLang();pick('polina');requestAnimationFrame(loop);
